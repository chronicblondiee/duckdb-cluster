services:
  write-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - write-data:/data
      - ./config-write.yaml:/etc/duckdb-cluster/config.yaml:ro
    command: ["start", "--config", "/etc/duckdb-cluster/config.yaml"]
    healthcheck:
      test: ["CMD", "duckdb-cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net

  read-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - read-data:/data
      - ./config-read.yaml:/etc/duckdb-cluster/config.yaml:ro
    command: ["start", "--config", "/etc/duckdb-cluster/config.yaml"]
    healthcheck:
      test: ["CMD", "duckdb-cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net
    depends_on:
      write-node:
        condition: service_healthy

  all-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    volumes:
      - all-data:/data
      - ./config-all.yaml:/etc/duckdb-cluster/config.yaml:ro
    command: ["start", "--config", "/etc/duckdb-cluster/config.yaml"]
    healthcheck:
      test: ["CMD", "duckdb-cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net
    depends_on:
      write-node:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - cluster-net
    depends_on:
      write-node:
        condition: service_healthy
      read-node:
        condition: service_healthy
      all-node:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cluster-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards.yml:ro
      - ../../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - cluster-net
    depends_on:
      - prometheus

networks:
  cluster-net:
    driver: bridge

volumes:
  write-data:
  read-data:
  all-data:
  prometheus-data:
  grafana-data:

services:
  write-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - write-data:/data
      - ./config-write.yaml:/etc/duckdb-cluster/config.yaml:ro
    command: ["start", "--config", "/etc/duckdb-cluster/config.yaml"]
    healthcheck:
      test: ["CMD", "duckdb-cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net

  read-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - read-data:/data
      - ./config-read.yaml:/etc/duckdb-cluster/config.yaml:ro
    command: ["start", "--config", "/etc/duckdb-cluster/config.yaml"]
    healthcheck:
      test: ["CMD", "duckdb-cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net
    depends_on:
      write-node:
        condition: service_healthy

  all-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    volumes:
      - all-data:/data
      - ./config-all.yaml:/etc/duckdb-cluster/config.yaml:ro
    command: ["start", "--config", "/etc/duckdb-cluster/config.yaml"]
    healthcheck:
      test: ["CMD", "duckdb-cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net
    depends_on:
      write-node:
        condition: service_healthy

networks:
  cluster-net:
    driver: bridge

volumes:
  write-data:
  read-data:
  all-data:

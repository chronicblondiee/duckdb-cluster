version: "3.9"

services:
  test-docker:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8093:8080"
    volumes:
      - ./test-config-docker.yaml:/config.yaml:ro
      - test-docker-data:/data
    command: ["start", "-config", "/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  test-docker-data:

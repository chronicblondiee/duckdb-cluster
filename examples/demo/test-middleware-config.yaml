target: all

common:
  data_dir: ./test-data-middleware
  num_shards: 1
  log_level: info

server:
  http_listen_addr: ":8092"
  grpc_listen_addr: ":9096"

security:
  authentication:
    enabled: true
    jwt_secret: "test-middleware-secret-key-32bytes!"
    token_expiration: 1h
    allow_anonymous: true
  rate_limit:
    enabled: true
    requests_per_second: 200
    burst: 400

reliability:
  timeouts:
    query_timeout: 60s
    write_timeout: 30s
    replication_timeout: 10s
    health_check_timeout: 5s
  backpressure:
    enabled: true
    max_concurrent_writes: 100
    max_concurrent_reads: 1000
    max_queue_size: 1000
    queue_timeout: 10s
  admission_control:
    enabled: false
  degradation:
    enabled: false
    auto_degrade: false

ism:
  enabled: false

observability:
  metrics:
    enabled: true
    path: /metrics
  logging:
    level: info
    format: text

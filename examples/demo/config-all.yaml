target: all

common:
  data_dir: /data
  num_shards: 3
  log_level: debug

server:
  http_listen_addr: ":8080"
  grpc_listen_addr: ":9095"

ring:
  instance_id: all-node
  instance_addr: "all-node:9095"
  memberlist:
    bind_addr: "0.0.0.0"
    bind_port: 7946
    join_peers:
      - "write-node:7946"
      - "read-node:7946"
      - "all-node:7946"

distributor:
  replication_factor: 1
  use_local_ingester: true

querier:
  merge_strategy: duckdb
  max_concurrent_queries: 100
  query_timeout: 60s
  read_consistency: one

security:
  authentication:
    enabled: true
    jwt_secret: "demo-secret-key-for-testing-only-32b!"
    token_expiration: 1h
    allow_anonymous: true
  rate_limit:
    enabled: true
    requests_per_second: 200
    burst: 400

reliability:
  timeouts:
    query_timeout: 60s
    write_timeout: 30s
    replication_timeout: 10s
    health_check_timeout: 5s
  backpressure:
    enabled: true
    max_concurrent_writes: 100
    max_concurrent_reads: 1000
    max_queue_size: 1000
    queue_timeout: 10s
  admission_control:
    enabled: false
  degradation:
    enabled: true
    auto_degrade: false
    error_threshold: 10

backup:
  storage_type: local
  local_path: /data/backups
  compression: true
  retention: 5
  schedule_interval: 0s

ism:
  enabled: true
  run_interval: 10s

observability:
  metrics:
    enabled: true
    path: /metrics
  tracing:
    enabled: true
    otlp_endpoint: "jaeger:4317"
    service_name: "duckdb-cluster"
    environment: "demo"
    sample_rate: 1.0
  logging:
    level: debug
    format: text

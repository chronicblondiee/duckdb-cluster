target: all

common:
  data_dir: /data
  num_shards: 3
  log_level: info

server:
  http_listen_addr: ":8080"
  grpc_listen_addr: ":9095"

security:
  authentication:
    enabled: true
    jwt_secret: "demo-secret-key-for-testing-only-32b!"
    token_expiration: 1h
    allow_anonymous: true
  rate_limit:
    enabled: true
    requests_per_second: 200
    burst: 400

reliability:
  timeouts:
    query_timeout: 60s
    write_timeout: 30s
    replication_timeout: 10s
    health_check_timeout: 5s
  backpressure:
    enabled: true
    max_concurrent_writes: 100
    max_concurrent_reads: 1000
    max_queue_size: 1000
    queue_timeout: 10s
  admission_control:
    enabled: false
  degradation:
    enabled: true
    auto_degrade: false
    error_threshold: 10

ism:
  enabled: true
  run_interval: 10s

observability:
  metrics:
    enabled: true
    path: /metrics
  logging:
    level: info
    format: text

syntax = "proto3";

package duckdb.cluster.v1;

option go_package = "github.com/brown/duckdb-cluster/proto/duckdbv1";

// HealthRequest is an empty health check request
message HealthRequest {}

// HealthResponse indicates service health
message HealthResponse {
  // Status: "healthy" or "unhealthy"
  string status = 1;
  
  // Number of shards owned/accessible by this service
  int32 shard_count = 2;
  
  // Error message if unhealthy
  string error = 3;
}
